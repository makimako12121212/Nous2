<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D122D"/>
      <stop offset="40%" stop-color="#4A1E3D"/>
      <stop offset="70%" stop-color="#30152C"/>
      <stop offset="100%" stop-color="#190B19"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD1DC" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#FFAAA6" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#FF8B94" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2D122D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heartGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FFE4E6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FDA4AF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coupleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FECDD3"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" rx="24"/>
  <circle cx="400" cy="400" r="360" fill="url(#glow)"/>

  <!-- Fairy Lights and Stars in Background -->
  <g opacity="0.75">
    <circle cx="150" cy="180" r="2.5" fill="#FFFBEB" filter="url(#softGlow)"/>
    <circle cx="220" cy="120" r="3.5" fill="#FEF3C7" filter="url(#softGlow)"/>
    <circle cx="340" cy="90" r="2" fill="#FFF"/>
    <circle cx="460" cy="85" r="3" fill="#FDE68A" filter="url(#softGlow)"/>
    <circle cx="580" cy="130" r="2.5" fill="#FFF"/>
    <circle cx="670" cy="200" r="3.5" fill="#FEF3C7" filter="url(#softGlow)"/>
    <circle cx="700" cy="350" r="2" fill="#FFFBEB"/>
    <circle cx="680" cy="500" r="3" fill="#FDE68A" filter="url(#softGlow)"/>
    <circle cx="600" cy="640" r="2" fill="#FFF"/>
    <circle cx="490" cy="710" r="3.5" fill="#FEF3C7" filter="url(#softGlow)"/>
    <circle cx="310" cy="720" r="2.5" fill="#FFF"/>
    <circle cx="180" cy="620" r="3" fill="#FDE68A" filter="url(#softGlow)"/>
    <circle cx="110" cy="480" r="2" fill="#FFF"/>
    <circle cx="100" cy="320" r="3.5" fill="#FEF3C7" filter="url(#softGlow)"/>
  </g>

  <!-- Large Floral Heart Arch -->
  <path d="M400,240 C340,110 160,120 160,280 C160,420 320,530 400,610 C480,530 640,420 640,280 C640,120 460,110 400,240 Z" 
        fill="url(#heartGlow)" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85"/>

  <!-- Floral and Fairy Lights along the Heart Arch -->
  <!-- Left Side Flowers -->
  <g filter="url(#softGlow)">
    <circle cx="390" cy="210" r="14" fill="#FDA4AF"/>
    <circle cx="360" cy="170" r="16" fill="#F43F5E"/>
    <circle cx="310" cy="140" r="18" fill="#FB7185"/>
    <circle cx="250" cy="140" r="20" fill="#FDA4AF"/>
    <circle cx="190" cy="170" r="18" fill="#F43F5E"/>
    <circle cx="155" cy="230" r="20" fill="#FB7185"/>
    <circle cx="150" cy="300" r="18" fill="#FDA4AF"/>
    <circle cx="170" cy="370" r="16" fill="#F43F5E"/>
    <circle cx="220" cy="440" r="15" fill="#FB7185"/>
    <circle cx="280" cy="500" r="14" fill="#FDA4AF"/>
    <circle cx="340" cy="560" r="12" fill="#F43F5E"/>

    <!-- Right Side Flowers -->
    <circle cx="410" cy="210" r="14" fill="#FDA4AF"/>
    <circle cx="440" cy="170" r="16" fill="#F43F5E"/>
    <circle cx="490" cy="140" r="18" fill="#FB7185"/>
    <circle cx="550" cy="140" r="20" fill="#FDA4AF"/>
    <circle cx="610" cy="170" r="18" fill="#F43F5E"/>
    <circle cx="645" cy="230" r="20" fill="#FB7185"/>
    <circle cx="650" cy="300" r="18" fill="#FDA4AF"/>
    <circle cx="630" cy="370" r="16" fill="#F43F5E"/>
    <circle cx="580" cy="440" r="15" fill="#FB7185"/>
    <circle cx="520" cy="500" r="14" fill="#FDA4AF"/>
    <circle cx="460" cy="560" r="12" fill="#F43F5E"/>

    <circle cx="400" cy="610" r="16" fill="#FFE4E6"/>
  </g>

  <!-- Sparkling warm light dots on arch -->
  <g fill="#FEF08A">
    <circle cx="380" cy="190" r="5" filter="url(#softGlow)"/>
    <circle cx="330" cy="150" r="6" filter="url(#softGlow)"/>
    <circle cx="270" cy="135" r="5" filter="url(#softGlow)"/>
    <circle cx="210" cy="155" r="6" filter="url(#softGlow)"/>
    <circle cx="160" cy="200" r="5" filter="url(#softGlow)"/>
    <circle cx="145" cy="265" r="6" filter="url(#softGlow)"/>
    <circle cx="160" cy="340" r="5" filter="url(#softGlow)"/>
    <circle cx="190" cy="405" r="6" filter="url(#softGlow)"/>
    <circle cx="250" cy="470" r="5" filter="url(#softGlow)"/>
    <circle cx="310" cy="530" r="6" filter="url(#softGlow)"/>

    <circle cx="420" cy="190" r="5" filter="url(#softGlow)"/>
    <circle cx="470" cy="150" r="6" filter="url(#softGlow)"/>
    <circle cx="530" cy="135" r="5" filter="url(#softGlow)"/>
    <circle cx="590" cy="155" r="6" filter="url(#softGlow)"/>
    <circle cx="640" cy="200" r="5" filter="url(#softGlow)"/>
    <circle cx="655" cy="265" r="6" filter="url(#softGlow)"/>
    <circle cx="640" cy="340" r="5" filter="url(#softGlow)"/>
    <circle cx="610" cy="405" r="6" filter="url(#softGlow)"/>
    <circle cx="550" cy="470" r="5" filter="url(#softGlow)"/>
    <circle cx="490" cy="530" r="6" filter="url(#softGlow)"/>
  </g>

  <!-- Tender Couple Silhouette Embracing in the Center -->
  <g transform="translate(400, 420)">
    <!-- Aura behind them -->
    <ellipse cx="0" cy="0" rx="90" ry="110" fill="#FFF1F2" opacity="0.3" filter="url(#softGlow)"/>

    <!-- She (Left / Centre) & He (Right / Centre) Embracing -->
    <!-- Partner 1 (Him - gently holding her) -->
    <path d="M-10, -50 C-10, -68 15, -68 15, -50 C15, -35 25, -20 35, 10 C45, 45 40, 95 30, 120 L-20, 120 C-10, 90 -10, 50 -10, -50 Z" 
          fill="#1C0A1C" opacity="0.95"/>
    
    <!-- Partner 2 (Her - with hijab / shawl gracefully wrapped, leaning on his shoulder) -->
    <path d="M-25, -52 C-38, -50 -48, -35 -45, -15 C-42, 5 -55, 30 -50, 75 C-45, 105 -35, 120 -15, 120 C-5, 120 5, 100 5, 70 C5, 40 -12, 10 -15, -15 C-17, -35 -15, -45 -25, -52 Z" 
          fill="#311331" opacity="0.95"/>

    <!-- Subtle loving details: their arms enfolding each other -->
    <path d="M10, 20 C0, 30 -30, 40 -35, 15 C-38, -2 -20, 5 -10, 15 Z" fill="#FDA4AF" opacity="0.6"/>
    <path d="M-30, 45 C-10, 55 25, 45 30, 25" stroke="#FECDD3" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Golden heart floating above their embrace -->
    <path d="M0, -85 C-10, -100 -30, -90 -25, -75 C-20, -60 0, -45 0, -45 C0, -45 20, -60 25, -75 C30, -90 10, -100 0, -85 Z" 
          fill="#F43F5E" filter="url(#softGlow)"/>
  </g>

  <!-- Romantic Foreground Typography & Light Glow -->
  <text x="400" y="690" font-family="'Playfair Display', serif, sans-serif" font-size="28" font-weight="600" fill="#FFE4E6" text-anchor="middle" letter-spacing="2">
    NOTRE COCON D'AMOUR
  </text>
  <text x="400" y="725" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#FBCFE8" text-anchor="middle" opacity="0.9" letter-spacing="1">
    Plus forts que le doute • Unis pour toujours
  </text>
</svg>
