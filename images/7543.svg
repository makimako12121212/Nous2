<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#31103F"/>
      <stop offset="100%" stop-color="#0F0C20"/>
    </linearGradient>
    <radialGradient id="bokeh1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh2" cx="70%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <filter id="handGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#nightSky)" rx="20"/>

  <!-- City streetlights bokeh outside the car window -->
  <circle cx="180" cy="320" r="90" fill="url(#bokeh1)"/>
  <circle cx="450" cy="240" r="110" fill="url(#bokeh2)"/>
  <circle cx="320" cy="180" r="70" fill="url(#bokeh1)" opacity="0.7"/>
  <circle cx="120" cy="520" r="80" fill="url(#bokeh2)" opacity="0.5"/>
  <circle cx="500" cy="480" r="90" fill="url(#bokeh1)" opacity="0.6"/>

  <!-- Delicate Silhouette of a Raised Hand with Rings in the night -->
  <g transform="translate(180, 200)" filter="url(#handGlow)">
    <!-- Wrist & Forearm -->
    <path d="M70, 480 C75, 420 80, 360 85, 300 C90, 260 92, 230 95, 190 C100, 160 110, 150 118, 140 L125, 60 C125, 40 140, 40 142, 60 L145, 130 L160, 50 C162, 30 178, 30 178, 50 L178, 130 L195, 65 C197, 45 212, 45 212, 65 L208, 145 L225, 95 C228, 80 240, 80 240, 98 L235, 185 C230, 240 215, 290 195, 360 C175, 420 160, 460 155, 480 Z" 
          fill="#FFF1F2" opacity="0.88"/>
    
    <!-- Delicate rings on fingers -->
    <ellipse cx="143" cy="95" rx="7" ry="3" fill="#FBBF24" opacity="0.9"/>
    <ellipse cx="178" cy="98" rx="7" ry="3" fill="#FBBF24" opacity="0.9"/>
    <ellipse cx="206" cy="115" rx="6" ry="3" fill="#FDE68A" opacity="0.9"/>

    <!-- Soft bracelet on wrist -->
    <ellipse cx="120" cy="340" rx="42" ry="12" fill="none" stroke="#FDE047" stroke-width="3" opacity="0.85"/>
    <ellipse cx="123" cy="352" rx="40" ry="11" fill="none" stroke="#FBBF24" stroke-width="2.5" opacity="0.85"/>
  </g>

  <!-- Poetic caption overlay -->
  <text x="300" y="700" font-family="'Playfair Display', serif, sans-serif" font-size="24" font-weight="600" fill="#FFE4E6" text-anchor="middle" letter-spacing="1.5">
    LA DOUCEUR DE TES GESTES
  </text>
  <text x="300" y="735" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#FECDD3" text-anchor="middle" opacity="0.9">
    Chaque détail en toi me fait tomber amoureux
  </text>
</svg>
